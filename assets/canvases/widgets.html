<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Store screenshot — widgets</title>
<style>
  :root {
    --u: calc(100vw / 660);
    --headline-size: {{HEADLINE_SIZE}};
    --bg: #0f2a22;
    --ink: #f4efe6;
    --accent: #8fd9b8;
    --muted: #b9cfc5;
    --cream: #f4efe6;
    --panel: #f8f7f3;
    {{THEME}}
    --pad-x: calc(64 * var(--u));
    --pad-top: calc(70 * var(--u));
    --pad-bottom: calc(40 * var(--u));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(46 * var(--u));
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    background:
      radial-gradient(calc(1000 * var(--u)) calc(680 * var(--u)) at 82% 16%, color-mix(in srgb, var(--accent) 24%, transparent) 0%, transparent 62%),
      linear-gradient(150deg, color-mix(in srgb, var(--bg) 90%, #000 10%) 0%, var(--bg) 54%, color-mix(in srgb, var(--bg) 78%, #000 22%) 100%);
  }
  .copy { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .eyebrow {
    font-size: calc(15 * var(--u));
    font-weight: 650;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(20 * var(--u));
  }
  .headline {
    font-size: calc(var(--headline-size) * var(--u));
    line-height: 1.02;
    letter-spacing: -.035em;
    font-weight: 750;
    text-align: center;
    text-wrap: balance;
    max-width: calc(548 * var(--u));
    max-height: calc(268 * var(--u));
    overflow: hidden;
  }
  .subline {
    font-size: calc(22 * var(--u));
    line-height: 1.32;
    color: var(--muted);
    text-align: center;
    max-width: calc(500 * var(--u));
    margin-top: calc(22 * var(--u));
    text-wrap: balance;
  }
  .panel {
    width: 100%;
    background: var(--panel);
    border-radius: calc(56 * var(--u));
    padding: calc(24 * var(--u));
    display: flex;
    flex-direction: column;
    gap: calc(18 * var(--u));
    box-shadow: 0 calc(38 * var(--u)) calc(70 * var(--u)) rgba(0, 0, 0, .38), 0 calc(8 * var(--u)) calc(18 * var(--u)) rgba(0, 0, 0, .22);
  }
  .panel img { display: block; border-radius: calc(30 * var(--u)); }
  .panel img.w { width: 100%; }
  .wrow { display: flex; gap: calc(18 * var(--u)); }
  .panel .wrow img { flex: 0 0 auto; width: calc((100% - calc(18 * var(--u))) / 2); }
</style>
</head>
<body>
<div class="canvas">
  <div class="copy">
    <div class="eyebrow">{{BRAND}}</div>
    <h1 class="headline">{{HEADLINE}}</h1>
    {{SUBLINE_BLOCK}}
  </div>
  <div class="panel">
    {{WIDGETS_BLOCK}}
  </div>
</div>
</body>
</html>
