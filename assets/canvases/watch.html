<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Store screenshot — Apple Watch</title>
<style>
  :root {
    --u: calc(100vw / 660);
    --headline-size: {{HEADLINE_SIZE}};
    --bg: #0f2a22;
    --ink: #f4efe6;
    --accent: #8fd9b8;
    --muted: #b9cfc5;
    --cream: #f4efe6;
    --panel: #0c0f0e;
    {{THEME}}
    --pad-x: calc(64 * var(--u));
    --pad-top: calc(70 * var(--u));
    --pad-bottom: calc(40 * var(--u));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(46 * var(--u));
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    background:
      radial-gradient(calc(1000 * var(--u)) calc(720 * var(--u)) at 50% 8%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 62%),
      linear-gradient(150deg, color-mix(in srgb, var(--bg) 90%, #000 10%) 0%, var(--bg) 54%, color-mix(in srgb, var(--bg) 78%, #000 22%) 100%);
  }
  .copy { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .eyebrow {
    font-size: calc(15 * var(--u));
    font-weight: 650;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(20 * var(--u));
  }
  .headline {
    font-size: calc(var(--headline-size) * var(--u));
    line-height: 1.02;
    letter-spacing: -.035em;
    font-weight: 750;
    text-align: center;
    text-wrap: balance;
    max-width: calc(548 * var(--u));
    max-height: calc(268 * var(--u));
    overflow: hidden;
  }
  .subline {
    font-size: calc(22 * var(--u));
    line-height: 1.32;
    color: var(--muted);
    text-align: center;
    max-width: calc(500 * var(--u));
    margin-top: calc(22 * var(--u));
    text-wrap: balance;
  }
  /* App layout */
  .watch {
    flex: 0 0 auto;
    position: relative;
    width: calc(482 * var(--u));
    height: calc(574 * var(--u));
    border-radius: calc(120 * var(--u));
    background: #14191a;
    padding: calc(13 * var(--u));
    box-shadow: 0 calc(40 * var(--u)) calc(74 * var(--u)) rgba(0, 0, 0, .46), inset 0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(255,255,255,.08);
  }
  .watch .screen {
    width: 100%;
    height: 100%;
    border-radius: calc(108 * var(--u));
    overflow: hidden;
    background: #000;
  }
  .watch .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .watch .crown {
    position: absolute;
    right: calc(-9 * var(--u));
    top: calc(168 * var(--u));
    width: calc(15 * var(--u));
    height: calc(64 * var(--u));
    border-radius: calc(8 * var(--u));
    background: linear-gradient(180deg, #4a504e, #2c3130);
  }
  .watch .sidebtn {
    position: absolute;
    right: calc(-7 * var(--u));
    top: calc(256 * var(--u));
    width: calc(11 * var(--u));
    height: calc(92 * var(--u));
    border-radius: calc(6 * var(--u));
    background: #232827;
  }
  /* Faces layout */
  .faces { width: 100%; display: flex; flex-direction: column; gap: calc(18 * var(--u)); }
  .faces img { display: block; width: 100%; border-radius: calc(46 * var(--u)); box-shadow: 0 calc(28 * var(--u)) calc(54 * var(--u)) rgba(0, 0, 0, .42); }

  /* Duo layout: two watch states side by side */
  .layout-duo.canvas { gap: calc(46 * var(--u)); padding-left: calc(30 * var(--u)); padding-right: calc(30 * var(--u)); }
  .watch-row { display: flex; align-items: center; justify-content: center; gap: calc(16 * var(--u)); width: 100%; }
  .layout-duo .watch { flex: 0 0 auto; width: calc(292 * var(--u)); height: calc(344 * var(--u)); border-radius: calc(72 * var(--u)); padding: calc(10 * var(--u)); }
  .layout-duo .watch .screen { border-radius: calc(62 * var(--u)); }
  .layout-duo .watch.w1 { transform: translateY(calc(-18 * var(--u))); }
  .layout-duo .watch.w2 { transform: translateY(calc(18 * var(--u))); }
  .layout-duo .watch .crown { right: calc(-7 * var(--u)); top: calc(108 * var(--u)); width: calc(12 * var(--u)); height: calc(48 * var(--u)); }
  .layout-duo .watch .sidebtn { right: calc(-5 * var(--u)); top: calc(172 * var(--u)); width: calc(8 * var(--u)); height: calc(64 * var(--u)); }
</style>
</head>
<body>
<div class="canvas {{LAYOUT_CLASS}}">
  <div class="copy">
    <div class="eyebrow">{{BRAND}}</div>
    <h1 class="headline">{{HEADLINE}}</h1>
    {{SUBLINE_BLOCK}}
  </div>
  {{WATCH_BLOCK}}
  <div class="faces">{{FACES_BLOCK}}</div>
</div>
</body>
</html>
