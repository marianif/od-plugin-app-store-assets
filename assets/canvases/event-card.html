<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-App Event card</title>
<style>
  :root {
    --u: calc(100vw / 1920);
    --bg: #0f2a22;
    --ink: #f4efe6;
    --accent: #8fd9b8;
    --muted: #b9cfc5;
    --cream: #f4efe6;
    --panel: #e9f4ef;
    {{THEME}}
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(calc(1100 * var(--u)) calc(680 * var(--u)) at 78% 26%, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 64%),
      linear-gradient(124deg, color-mix(in srgb, var(--bg) 90%, #000 10%) 0%, var(--bg) 54%, color-mix(in srgb, var(--bg) 78%, #000 22%) 100%);
    overflow: hidden;
  }
  .badge-safe { position: absolute; left: 0; top: 0; width: calc(240 * var(--u)); height: calc(240 * var(--u)); }
  .copy {
    position: absolute;
    left: calc(120 * var(--u));
    bottom: calc(96 * var(--u));
    max-width: calc(980 * var(--u));
  }
  .kicker {
    font-size: calc(24 * var(--u));
    font-weight: 650;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(20 * var(--u));
  }
  .title {
    font-size: calc({{TITLE_SIZE}} * var(--u));
    line-height: .99;
    letter-spacing: -.04em;
    font-weight: 780;
    max-width: calc(940 * var(--u));
    max-height: calc(200 * var(--u));
    overflow: hidden;
    text-wrap: balance;
  }
  .sub {
    margin-top: calc(22 * var(--u));
    font-size: calc(28 * var(--u));
    color: var(--muted);
    max-width: calc(700 * var(--u));
  }
  .device {
    position: absolute;
    right: calc(120 * var(--u));
    top: calc(210 * var(--u));
    width: calc(520 * var(--u));
    height: calc(1080 * var(--u));
    border-radius: calc(80 * var(--u));
    background: #0b1f19;
    padding: calc(15 * var(--u));
    transform: rotate(6deg);
    box-shadow: calc(-30 * var(--u)) calc(52 * var(--u)) calc(96 * var(--u)) rgba(0, 0, 0, .34);
  }
  .device .screen {
    width: 100%; height: 100%;
    border-radius: calc(66 * var(--u));
    overflow: hidden;
    background: var(--panel);
    display: grid;
    place-items: center;
  }
  .device img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .device .ph { color: #5a6b64; font-size: calc(22 * var(--u)); }
  .rings { position: absolute; right: calc(-260 * var(--u)); bottom: calc(-420 * var(--u)); width: calc(1100 * var(--u)); height: calc(1100 * var(--u)); opacity: .35; }
  .rings span { position: absolute; inset: 0; border: calc(1.6 * var(--u)) solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 50%; }
  .rings span:nth-child(2) { inset: calc(110 * var(--u)); opacity: .65; }
  .rings span:nth-child(3) { inset: calc(220 * var(--u)); opacity: .4; }
  .rings span:nth-child(4) { inset: calc(330 * var(--u)); opacity: .25; }
</style>
</head>
<body>
<div class="canvas">
  <div class="badge-safe"></div>
  <div class="rings"><span></span><span></span><span></span><span></span></div>
  <div class="copy">
    <div class="kicker">{{KICKER}}</div>
    <div class="title">{{TITLE}}</div>
    {{SUB_BLOCK}}
  </div>
  <div class="device">
    <div class="screen">{{SHOT_BLOCK}}</div>
  </div>
</div>
</body>
</html>
