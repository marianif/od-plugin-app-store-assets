<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Store search results creative</title>
<style>
  :root {
    --u: calc(100vw / 1920);
    --bg: #0f2a22;
    --ink: #f4efe6;
    --accent: #8fd9b8;
    --muted: #b9cfc5;
    --cream: #f4efe6;
    --panel: #e9f4ef;
    {{THEME}}
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(calc(1000 * var(--u)) calc(700 * var(--u)) at 82% 30%, color-mix(in srgb, var(--accent) 26%, transparent) 0%, transparent 62%),
      linear-gradient(122deg, color-mix(in srgb, var(--bg) 90%, #000 10%) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 80%, #000 20%) 100%);
    overflow: hidden;
  }
  .safe {
    position: absolute;
    left: calc(418 * var(--u));
    top: calc(382 * var(--u));
    width: calc(1084 * var(--u));
    height: calc(516 * var(--u));
  }
  .kicker {
    font-size: calc(26 * var(--u));
    font-weight: 650;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(26 * var(--u));
  }
  .hook {
    font-size: calc({{HOOK_SIZE}} * var(--u));
    line-height: .98;
    letter-spacing: -.045em;
    font-weight: 780;
    max-width: calc(760 * var(--u));
    max-height: calc(318 * var(--u));
    overflow: hidden;
    text-wrap: balance;
  }
  .subhook {
    margin-top: calc(26 * var(--u));
    font-size: calc(30 * var(--u));
    line-height: 1.3;
    color: var(--muted);
    max-width: calc(560 * var(--u));
  }
  .device {
    position: absolute;
    right: calc(140 * var(--u));
    top: calc(286 * var(--u));
    width: calc(560 * var(--u));
    height: calc(1164 * var(--u));
    border-radius: calc(86 * var(--u));
    background: #0b1f19;
    padding: calc(16 * var(--u));
    transform: rotate(-7deg);
    box-shadow:
      calc(-20 * var(--u)) calc(50 * var(--u)) calc(90 * var(--u)) rgba(0, 0, 0, .34),
      0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, .2);
  }
  .device .screen {
    width: 100%;
    height: 100%;
    border-radius: calc(70 * var(--u));
    overflow: hidden;
    background: var(--panel);
    display: grid;
    place-items: center;
  }
  .device img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .device .ph { color: #5a6b64; font-size: calc(22 * var(--u)); }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background-image: radial-gradient(rgba(255,255,255,.35) .6px, transparent .6px);
    background-size: calc(3 * var(--u)) calc(3 * var(--u));
    mix-blend-mode: soft-light;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="safe">
    <div class="kicker">{{KICKER}}</div>
    <div class="hook">{{HOOK}}</div>
    {{SUBHOOK_BLOCK}}
  </div>
  <div class="device">
    <div class="screen">{{SHOT_BLOCK}}</div>
  </div>
  <div class="grain"></div>
</div>
</body>
</html>
